services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${USER_NAME}
      POSTGRES_PASSWORD: ${PASSWORD}
      POSTGRES_DB: ${DEV_DB_NAME}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${USER_NAME} -d ${DEV_DB_NAME}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - phi_network

  redis:
    image: redis:7-alpine    
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - phi_network

  # Add inside the `services:` block, after the `redis:` service

  zookeeper:
    image: confluentinc/cp-zookeeper:7.5.0
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_OPTS: "-Dzookeeper.4lw.commands.whitelist=*"
    networks:
      - phi_network

  kafka:
    image: confluentinc/cp-kafka:7.5.0
    depends_on:
      - zookeeper
    ports:
      - "9092:9092"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:29092,PLAINTEXT_HOST://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    healthcheck:
      test: ["CMD", "kafka-broker-api-versions", "--bootstrap-server", "localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    networks:
      - phi_network
  
  karafka:
    build:
      context: .
      target: development
    command: >
      bash -c "
        bundle install &&
        bundle exec karafka server
      "
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      DATABASE_URL: postgres://${USER_NAME}:${PASSWORD}@db:${DB_PORT}/${DEV_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - phi_network
  web:
    build:
      context: .
      target: development
    command: >
      bash -c "
        rm -f tmp/pids/server.pid &&
        bundle install &&
        bin/rails db:prepare &&
        bin/rails server -b 0.0.0.0 -p ${PORT}
      "
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    ports:
      - "${PORT}:${PORT}"
    environment:
      DATABASE_URL: postgres://${USER_NAME}:${PASSWORD}@db:${DB_PORT}/${DEV_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS}
      RAILS_LOG_LEVEL: ${RAILS_LOG_LEVEL}
      DATABASE_HOST: db
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phi_network

  sidekiq:
    build:
      context: .
      target: development
    command: >
      bash -c "
        bundle install &&
        bundle exec sidekiq -c ${JOB_CONCURRENCY}
      "
    volumes:
      - .:/rails
      - bundle_cache:/usr/local/bundle
    environment:
      DATABASE_URL: postgres://${USER_NAME}:${PASSWORD}@db:${DB_PORT}/${DEV_DB_NAME}
      REDIS_URL: redis://redis:6379/0
      RAILS_MAX_THREADS: ${RAILS_MAX_THREADS}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - phi_network

volumes:
  postgres_data:
  bundle_cache:

networks:
  phi_network:
    driver: bridge
